services:
  db:
    # pgvector build of Postgres 16 — the knowledge base stores embeddings in
    # vector() columns with HNSW indexes, which stock postgres:16-alpine cannot
    # do. Note this image is Debian/glibc while the old one was Alpine/musl:
    # swapping it over an existing volume changes the collation library, so the
    # volume must be recreated rather than reused (see PROCEDURE.md).
    image: pgvector/pgvector:pg16
    container_name: acc-db
    environment:
      POSTGRES_USER: acc
      POSTGRES_PASSWORD: acc
      POSTGRES_DB: callcentre
    ports:
      - "5433:5432"   # host 5433 — 5432 commonly taken by a local Postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acc -d callcentre"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
