[project]
name = "acc-backend"
version = "0.1.0"
description = "AI automated call center - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    # Phase 7 — knowledge base. httpx was only transitive (pipecat/google-genai)
    # until services/embeddings.py made it a first-class runtime dependency.
    "httpx>=0.27",
    "pgvector>=0.3",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/ has no __init__.py, so bare `pytest` puts tests/ on sys.path rather
# than backend/, and the cross-module imports (test_knowledge_api pulls a PDF
# fixture out of test_knowledge_ingest) fail to collect. `python -m pytest`
# happened to work because it prepends the cwd; this makes both work.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
